                  "@type": "Answer",
                  "text": "Spectral is an onchain neobank built on authorization rather than ownership. Instead of a public wallet holding a public balance, you hold a zero-knowledge credential that proves you are allowed to spend. Funds live in a shielded pool, payments are routed by relayers, and merchants are paid in ordinary stablecoins."

                "@type": "Question",
                "name": "If there is no wallet address, how do I hold money?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your deposit becomes a note inside a shared shielded pool. The note is a commitment that only a valid proof can consume. Nothing in the pool is addressed to you, which is why an outside observer cannot read your balance, and why there is no address to correlate across payments."
                }
              },
              {
                "@type": "Question",
                "name": "What does authorization-based mean in practice?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "When you pay, you do not present a key that says these funds are mine. You present a proof that says a rule permits this spend: the credential is valid, the note has not been consumed, and the amount sits inside your limit. The protocol verifies the proof and the payment settles."
                }
              },

                "@type": "Question",

                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "That is the point of the design. Daily limits, merchant allowlists, and signed audit reports are enforced by the circuits themselves, so a regulator or an auditor can be given a verifiable report without anyone publishing a spending history. Merchants receive clean USDC or USDT with no history attached."
                }
              },
